plugins {
    id 'org.springframework.boot' version '3.5.14' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'xyz.star4y'
    version = '0.1.0-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

configure(subprojects.findAll { it.name in ['service-api', 'service', 'plugin-api', 'plugin-example', 'plugin-usage-maid', 'plugin-whale-widget', 'plugin-dynamic-island'] }) {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom 'org.springframework.boot:spring-boot-dependencies:3.5.14'
        }
    }

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 25
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaExec).configureEach {
        javaLauncher = javaToolchains.launcherFor {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }
}

tasks.register('publishArtifact', Exec) {
    group = 'distribution'
    description = 'Run tests, build the executable jar with WebUI, and refresh repository artifacts.'
    dependsOn ':service:test', ':service:bootJar'
    workingDir = rootDir
    commandLine 'bash', './scripts/publish-artifact.sh'
    environment 'SKIP_BUILD', 'true'
    environment 'RUN_TESTS', 'false'
}

tasks.register('publishArtifactFast', Exec) {
    group = 'distribution'
    description = 'Build the executable jar with WebUI and refresh repository artifacts without running tests.'
    dependsOn ':service:bootJar'
    workingDir = rootDir
    commandLine 'bash', './scripts/publish-artifact.sh'
    environment 'SKIP_BUILD', 'true'
    environment 'RUN_TESTS', 'false'
}
