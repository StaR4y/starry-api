plugins {
    id 'java-library'
}

dependencies {
    api 'org.pf4j:pf4j:3.15.1'
    api 'io.projectreactor:reactor-core'
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
}

// The SDK is Apache-2.0 while the rest of the project is AGPL-3.0-only, so its jars carry their own license text.
tasks.withType(Jar).configureEach {
    from(layout.projectDirectory.file('LICENSE')) { into 'META-INF' }
    from(layout.projectDirectory.file('NOTICE')) { into 'META-INF' }
}
