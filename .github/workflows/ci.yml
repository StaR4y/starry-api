name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java 25, WebUI, PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_POSTGRES_IMAGE: postgres:17-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Use the newest 22.x release instead of whatever the runner image cached, so Node security releases apply.
          check-latest: true
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify Docker
        run: docker info

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends expect

      - name: Test installer rollback paths
        run: ./scripts/test-install-server.sh

      - name: Test data-management recovery tool
        run: ./scripts/test-recover-data-management.sh

      - name: Test starry-api administration command
        run: ./scripts/test-starry-api.sh

      - name: Run all tests and build WebUI
        run: ./gradlew --no-daemon clean test :webui:npmBuild

      - name: Test artifact publisher idempotency
        run: |
          ./gradlew --no-daemon :service:bootJar -PskipWebuiBuild=true
          artifact_test_dir="$(mktemp -d)"
          RUN_TESTS=false SKIP_BUILD=true ARTIFACT_DIR="$artifact_test_dir" \
            ./scripts/publish-artifact.sh
          RUN_TESTS=false SKIP_BUILD=true ARTIFACT_DIR="$artifact_test_dir" \
            ./scripts/publish-artifact.sh
          test -x "$artifact_test_dir/runtime/recover-data-management.sh"
          cmp scripts/recover-data-management.sh \
            "$artifact_test_dir/runtime/recover-data-management.sh"
          test -x "$artifact_test_dir/starry-api.sh"
          cmp scripts/starry-api.sh "$artifact_test_dir/starry-api.sh"
          tar -tzf "$artifact_test_dir/starry-api-bundle.tar.gz" | grep -q '^\./starry-api\.sh$'
          (cd "$artifact_test_dir" && sha256sum -c sha256sums.txt)

      - name: Verify PostgreSQL integration tests ran
        run: |
          for report in \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.PostgreSqlBaselineIntegrationTest.xml \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.AdminCliPostgreSqlIntegrationTest.xml; do
            test -f "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -q 'skipped="0"' "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'errors="0"' "$report"
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-17-test-reports
          path: service/build/reports/tests/test
          if-no-files-found: ignore

  postgresql-18:
    name: PostgreSQL 18 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_POSTGRES_IMAGE: postgres:18-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify Docker
        run: docker info

      - name: Run PostgreSQL integration tests
        run: ./gradlew --no-daemon :service:test --tests 'tech.starryapi.postgresql.*'

      - name: Verify PostgreSQL integration tests ran
        run: |
          for report in \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.PostgreSqlBaselineIntegrationTest.xml \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.AdminCliPostgreSqlIntegrationTest.xml; do
            test -f "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -q 'skipped="0"' "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'errors="0"' "$report"
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-18-test-reports
          path: service/build/reports/tests/test
          if-no-files-found: ignore
