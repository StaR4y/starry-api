name: CI

on:
  push:
    # A tag runs these tests through the release workflow.
    branches:
      - "**"
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Java 25, WebUI, PostgreSQL 17
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      TEST_POSTGRES_IMAGE: postgres:17-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          # Use the newest 22.x release instead of whatever the runner image cached, so Node security releases apply.
          check-latest: true
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Verify Docker
        run: docker info

      - name: Install shell test dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends expect

      - name: Test the installer's image selection and rollback paths
        run: ./scripts/test-install.sh

      - name: Test data-management recovery tool
        run: ./scripts/test-recover-data-management.sh

      - name: Test starry-api administration command
        run: ./scripts/test-starry-api.sh

      - name: Test the release content check
        run: ./scripts/test-check-release-contents.sh

      - name: Run all tests and build WebUI
        run: ./gradlew --no-daemon clean test :webui:npmBuild

      # Mihomo is GPL-3.0 and optional: Docker pulls its image at deploy time, and no binary or saved image may enter the jar
      # or our image. Both must also carry the license files; the docker-image job checks the image.
      - name: Check the jar for Mihomo binaries and missing license files
        run: |
          ./gradlew --no-daemon :service:bootJar -PskipWebuiBuild=true
          ./scripts/check-release-contents.sh service/build/libs/starry-api.jar

      - name: Test the console license footer and third-party notices
        run: npm --prefix webui run test:legal

      - name: Test the links the console takes from remote data
        run: npm --prefix webui run test:links

      - name: Verify PostgreSQL integration tests ran
        run: |
          for report in \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.PostgreSqlBaselineIntegrationTest.xml \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.AdminCliPostgreSqlIntegrationTest.xml; do
            test -f "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -q 'skipped="0"' "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'errors="0"' "$report"
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-17-test-reports
          path: service/build/reports/tests/test
          if-no-files-found: ignore

  docker-image:
    name: Docker image and installer
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build --build-arg STARRY_VERSION=ci -t starry-api:ci .

      - name: Check what the image carries
        run: ./scripts/check-release-contents.sh --image starry-api:ci

      - name: Install, upgrade and roll back with the real installer
        run: sudo ./scripts/test-install-e2e.sh starry-api:ci

  postgresql-18:
    name: PostgreSQL 18 compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_POSTGRES_IMAGE: postgres:18-alpine
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Verify Docker
        run: docker info

      - name: Run PostgreSQL integration tests
        run: ./gradlew --no-daemon :service:test --tests 'tech.starryapi.postgresql.*'

      - name: Verify PostgreSQL integration tests ran
        run: |
          for report in \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.PostgreSqlBaselineIntegrationTest.xml \
            service/build/test-results/test/TEST-tech.starryapi.postgresql.AdminCliPostgreSqlIntegrationTest.xml; do
            test -f "$report"
            grep -Eq 'tests="[1-9][0-9]*"' "$report"
            grep -q 'skipped="0"' "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'errors="0"' "$report"
          done

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: postgres-18-test-reports
          path: service/build/reports/tests/test
          if-no-files-found: ignore
