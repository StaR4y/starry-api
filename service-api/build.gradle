plugins {
    id 'java-library'
}

java {
    withSourcesJar()
}

dependencies {
    api 'tools.jackson.core:jackson-databind'
    api 'jakarta.validation:jakarta.validation-api'
    api 'org.springframework:spring-web'
    api 'org.springframework:spring-webflux'
    api 'io.projectreactor:reactor-core'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// service-api is part of the AGPL-3.0-only code base (the Apache-2.0 SDK is plugin-api), and plugin developers build
// against its jars, so its jars carry the license text and the notices like the executable jar does.
tasks.withType(Jar).configureEach {
    from(rootProject.layout.projectDirectory.file('LICENSE')) { into 'META-INF' }
    from(rootProject.layout.projectDirectory.file('NOTICE')) { into 'META-INF' }
}
