# docker compose -f docker-compose.yml -f docker-compose.egress.yml up -d --build
services:
  service:
    environment:
      STARRY_EGRESS_MIHOMO_ENABLED: "true"
      STARRY_EGRESS_CONTROLLER_URL: http://127.0.0.1:9090
      STARRY_EGRESS_CONTROLLER_BIND: 127.0.0.1:9090
      STARRY_EGRESS_CONTROLLER_SECRET: ${STARRY_EGRESS_CONTROLLER_SECRET:?Set a random alphanumeric controller secret}
      STARRY_EGRESS_LISTENER_HOST: 127.0.0.1
      STARRY_EGRESS_LISTENER_BIND: 127.0.0.1
      STARRY_EGRESS_TLS_ENABLED: "true"
      STARRY_EGRESS_TLS_URL: http://127.0.0.1:9091
      STARRY_TLS_SECRET: ${STARRY_TLS_SECRET:?Set a random TLS bridge secret}
  mihomo:
    image: metacubex/mihomo:v1.19.32
    network_mode: "service:service"
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      STARRY_EGRESS_CONTROLLER_SECRET: ${STARRY_EGRESS_CONTROLLER_SECRET:?Set a random alphanumeric controller secret}
    volumes:
      - ./docker/egress/mihomo-entrypoint.sh:/entrypoint.sh:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
  tls-bridge:
    network_mode: "service:service"
    build:
      context: .
      dockerfile: docker/egress/Dockerfile
    restart: unless-stopped
    environment:
      STARRY_TLS_SECRET: ${STARRY_TLS_SECRET:?Set a random TLS bridge secret}
      STARRY_TLS_BIND: 127.0.0.1
    read_only: true
    tmpfs:
      - /tmp:size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
