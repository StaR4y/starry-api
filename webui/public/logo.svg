<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Starry API</title>
  <desc id="desc">A four-point star with an S-shaped route running through it, on a blue to violet rounded square.</desc>
  <defs>
    <linearGradient id="sky" x1="24" y1="12" x2="232" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3F7BFF" />
      <stop offset="0.55" stop-color="#5E55F5" />
      <stop offset="1" stop-color="#9A4DF0" />
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(64 40) scale(190)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.18" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="star" x1="60" y1="52" x2="200" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="1" stop-color="#E3DEFF" />
    </linearGradient>
    <!-- The S-shaped route is cut out of the star, so the background shows through it. -->
    <mask id="route">
      <rect width="256" height="256" fill="#FFFFFF" />
      <path d="M176 86C120 70 108 104 128 128S136 186 80 170" fill="none" stroke="#000000" stroke-width="15" stroke-linecap="round" />
    </mask>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#sky)" />
  <rect width="256" height="256" rx="58" fill="url(#glow)" />
  <path
    d="M128 26C137 81 175 119 230 128C175 137 137 175 128 230C119 175 81 137 26 128C81 119 119 81 128 26Z"
    fill="url(#star)"
    mask="url(#route)"
  />
</svg>
