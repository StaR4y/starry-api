<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Starry API Logo</title>
  <desc id="desc">A refined blue and violet geometric hexagon logo.</desc>
  <defs>
    <linearGradient id="bg" x1="42" y1="34" x2="214" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5B8DEF" />
      <stop offset="0.52" stop-color="#7B7CFF" />
      <stop offset="1" stop-color="#B387FF" />
    </linearGradient>
    <linearGradient id="panel" x1="58" y1="42" x2="200" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="0.46" stop-color="#FFFFFF" stop-opacity="0.06" />
      <stop offset="1" stop-color="#101827" stop-opacity="0.18" />
    </linearGradient>
    <linearGradient id="line" x1="62" y1="48" x2="194" y2="208" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.58" stop-color="#EEF4FF" />
      <stop offset="1" stop-color="#D8E0FF" stop-opacity="0.9" />
    </linearGradient>
    <radialGradient id="highlight" cx="34%" cy="24%" r="74%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.48" />
      <stop offset="0.42" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="softShadow" x="-24%" y="-24%" width="148%" height="156%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#3D4DD8" flood-opacity="0.24" />
    </filter>
    <filter id="lineGlow" x="-18%" y="-18%" width="136%" height="136%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur" />
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.55 0 0 0 0 0.62 0 0 0 0 1 0 0 0 0.5 0" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#bg)" />
    <rect x="24" y="24" width="208" height="208" rx="48" fill="url(#highlight)" />
    <rect x="25" y="25" width="206" height="206" rx="47" fill="none" stroke="#FFFFFF" stroke-opacity="0.24" stroke-width="2" />

    <g filter="url(#lineGlow)">
      <path
        d="M128 47L198.1 87.5V168.5L128 209L57.9 168.5V87.5L128 47Z"
        fill="url(#panel)"
        stroke="url(#line)"
        stroke-width="5"
        stroke-linejoin="miter"
      />
      <path
        d="M128 69L179.1 98.5V157.5L128 187L76.9 157.5V98.5L128 69Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.76"
        stroke-width="2.8"
        stroke-linejoin="miter"
      />
      <path
        d="M128 92L159.2 110V146L128 164L96.8 146V110L128 92Z"
        fill="none"
        stroke="#FFFFFF"
        stroke-opacity="0.42"
        stroke-width="1.8"
        stroke-linejoin="miter"
      />
    </g>

    <path
      d="M89 157L128 134L167 157"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.34"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M89 99L128 122L167 99"
      fill="none"
      stroke="#FFFFFF"
      stroke-opacity="0.28"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
