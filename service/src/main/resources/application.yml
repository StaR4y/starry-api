server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  compression:
    enabled: true
  netty:
    connection-timeout: 3s

spring:
  application:
    name: starryapi-service
  task:
    scheduling:
      pool:
        # There are ~26 @Scheduled jobs (billing recovery, payment reconciliation, aggregation, lock refresh...).
        # Spring Boot's default is ONE thread, so a single slow job delays all of the others.
        size: 4
  lifecycle:
    timeout-per-shutdown-phase: 20s
  r2dbc:
    url: r2dbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:starry_api}?schema=starry_api&sslMode=${POSTGRES_SSL_MODE:disable}&tcpKeepAlive=true&applicationName=starry-api&preparedStatementCacheQueries=${POSTGRES_PREPARED_STATEMENT_CACHE_QUERIES:256}&statementTimeout=${POSTGRES_STATEMENT_TIMEOUT:PT2M}&lockWaitTimeout=${POSTGRES_LOCK_WAIT_TIMEOUT:PT5S}
    username: ${POSTGRES_USERNAME:starry_api}
    password: ${POSTGRES_PASSWORD:}
    pool:
      initial-size: ${POSTGRES_POOL_INITIAL_SIZE:4}
      max-size: ${POSTGRES_POOL_MAX_SIZE:20}
      max-acquire-time: ${POSTGRES_POOL_MAX_ACQUIRE_TIME:5s}
      max-create-connection-time: ${POSTGRES_POOL_MAX_CREATE_CONNECTION_TIME:5s}
      max-idle-time: 30m
      max-life-time: ${POSTGRES_POOL_MAX_LIFE_TIME:2h}
      validation-depth: local
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DATABASE:starry_api}?currentSchema=starry_api&sslmode=${POSTGRES_SSL_MODE:disable}&tcpKeepAlive=true&ApplicationName=starry-api-flyway
    user: ${POSTGRES_MIGRATION_USERNAME:starry_api_migration}
    password: ${POSTGRES_MIGRATION_PASSWORD:}
    default-schema: starry_api
    schemas: starry_api
    create-schemas: false
    init-sqls:
      - SET ROLE starry_api_owner
    connect-retries: ${FLYWAY_CONNECT_RETRIES:10}
    clean-disabled: true
  jackson:
    # Responses omit null properties (and null map values), as they always have.
    default-property-inclusion: non_null
    # Everything else that departs from Jackson 3's defaults is in tech.starryapi.config.JacksonConfig.
  http:
    codecs:
      max-in-memory-size: ${SPRING_CODEC_MAX_IN_MEMORY_SIZE:16MB}
  webflux:
    multipart:
      max-in-memory-size: 256KB
      max-headers-size: 16KB
      max-disk-usage-per-part: ${STARRY_MAX_IMPORT_BYTES:268435456}B
      max-parts: 4

management:
  endpoints:
    # Boot 4 serializes endpoint JSON with a private Jackson 3 mapper that sorts properties alphabetically; use the
    # application's mapper so /actuator/health keeps the {"status":...,"groups":...} layout probes already read.
    jackson:
      isolated-json-mapper: false
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /v3/api-docs

starry:
  egress:
    mihomo-enabled: ${STARRY_EGRESS_MIHOMO_ENABLED:false}
    controller-url: ${STARRY_EGRESS_CONTROLLER_URL:http://127.0.0.1:9090}
    controller-bind: ${STARRY_EGRESS_CONTROLLER_BIND:127.0.0.1:9090}
    controller-secret: ${STARRY_EGRESS_CONTROLLER_SECRET:}
    listener-host: ${STARRY_EGRESS_LISTENER_HOST:127.0.0.1}
    listener-bind: ${STARRY_EGRESS_LISTENER_BIND:127.0.0.1}
    interface-name: ${STARRY_EGRESS_INTERFACE_NAME:}
    tls-enabled: ${STARRY_EGRESS_TLS_ENABLED:false}
    tls-url: ${STARRY_EGRESS_TLS_URL:http://127.0.0.1:9091}
    tls-secret: ${STARRY_TLS_SECRET:}
    probe-url: ${STARRY_EGRESS_PROBE_URL:https://api.ipify.org?format=json}
    activation-failure-backoff: ${STARRY_EGRESS_ACTIVATION_FAILURE_BACKOFF:5s}
  documentation:
    attachment-dir: ${STARRY_DOCUMENTATION_ATTACHMENT_DIR:${user.home}/.starry-api/documentation}
  plugins:
    directory: ${STARRY_PLUGIN_DIR:${user.home}/.starry-api/plugins}
    disabled: ${STARRY_PLUGINS_DISABLED:false}
  model-pricing:
    remote-refresh-enabled: ${STARRY_MODEL_PRICING_REMOTE_REFRESH_ENABLED:true}
    sync-catalog-ids: ${STARRY_MODEL_PRICING_SYNC_CATALOG_IDS:false}
    source-url: ${STARRY_MODEL_PRICING_SOURCE_URL:https://raw.githubusercontent.com/Wei-Shaw/model-price-repo/main/model_prices_and_context_window.json}
    checksum-url: ${STARRY_MODEL_PRICING_CHECKSUM_URL:https://raw.githubusercontent.com/Wei-Shaw/model-price-repo/main/model_prices_and_context_window.sha256}
    refresh-interval: ${STARRY_MODEL_PRICING_REFRESH_INTERVAL:PT10M}
    max-catalog-bytes: ${STARRY_MODEL_PRICING_MAX_CATALOG_BYTES:4194304}
    cache-dir: ${STARRY_MODEL_PRICING_DIR:${user.home}/.starry-api/model-pricing}
  model-ranking:
    enabled: ${STARRY_MODEL_RANKING_ENABLED:true}
    remote-refresh-enabled: ${STARRY_MODEL_RANKING_REMOTE_REFRESH_ENABLED:true}
    cache-dir: ${STARRY_MODEL_RANKING_DIR:${user.home}/.starry-api/model-ranking}
    refresh-cron: ${STARRY_MODEL_RANKING_REFRESH_CRON:0 40 4 * * *}
    max-bytes: ${STARRY_MODEL_RANKING_MAX_BYTES:1048576}
    max-entries: ${STARRY_MODEL_RANKING_MAX_ENTRIES:12}
    programbench-url: ${STARRY_MODEL_RANKING_PROGRAMBENCH_URL:https://raw.githubusercontent.com/StaR4y/ai-benchmark-ranking/main/data/programbench.json}
    frontierbench-url: ${STARRY_MODEL_RANKING_FRONTIERBENCH_URL:https://raw.githubusercontent.com/StaR4y/ai-benchmark-ranking/main/data/frontierbench.json}
  account-allocation:
    maintenance-enabled: ${STARRY_ACCOUNT_ALLOCATION_MAINTENANCE_ENABLED:true}
    maintenance-cron: ${STARRY_ACCOUNT_ALLOCATION_MAINTENANCE_CRON:0 35 * * * *}
    lease-retention-days: ${STARRY_ACCOUNT_ALLOCATION_LEASE_RETENTION_DAYS:7}
    event-retention-days: ${STARRY_ACCOUNT_ALLOCATION_EVENT_RETENTION_DAYS:90}
    delete-batch-size: ${STARRY_ACCOUNT_ALLOCATION_DELETE_BATCH_SIZE:10000}
    delete-max-batches: ${STARRY_ACCOUNT_ALLOCATION_DELETE_MAX_BATCHES:20}
  models:
    icon-dir: ${STARRY_MODEL_ICON_DIR:${user.home}/.starry-api/model-icons}
    max-icon-bytes: ${STARRY_MODEL_MAX_ICON_BYTES:2097152}
  appearance:
    branding-dir: ${STARRY_APPEARANCE_BRANDING_DIR:${user.home}/.starry-api/branding}
    max-logo-bytes: ${STARRY_APPEARANCE_MAX_LOGO_BYTES:8388608}
    max-background-bytes: ${STARRY_APPEARANCE_MAX_BACKGROUND_BYTES:16777216}
  data-transfer:
    backup-dir: ${STARRY_BACKUP_DIR:${user.home}/.starry-api/backups}
    max-import-bytes: ${STARRY_MAX_IMPORT_BYTES:268435456}
    process-timeout: ${STARRY_DATA_TRANSFER_PROCESS_TIMEOUT:30m}
  data-management:
    security-file: ${STARRY_DATA_MANAGEMENT_SECURITY_FILE:${user.home}/.starry-api/security/data-management.json}
    recovery-key-file: ${STARRY_DATA_MANAGEMENT_RECOVERY_KEY_FILE:}
    require-initialized: ${STARRY_DATA_MANAGEMENT_REQUIRE_INITIALIZED:false}
  stats:
    aggregation-enabled: ${STARRY_STATS_AGGREGATION_ENABLED:true}
    aggregation-interval: ${STARRY_STATS_AGGREGATION_INTERVAL:PT1M}
    aggregation-initial-delay: ${STARRY_STATS_AGGREGATION_INITIAL_DELAY:PT30S}
    aggregation-max-advance-hours: ${STARRY_STATS_AGGREGATION_MAX_ADVANCE_HOURS:1}
    aggregation-lookback-hours: ${STARRY_STATS_AGGREGATION_LOOKBACK_HOURS:6}
    aggregation-max-batches-per-run: ${STARRY_STATS_AGGREGATION_MAX_BATCHES_PER_RUN:6}
    maintenance-cron: ${STARRY_STATS_MAINTENANCE_CRON:0 25 3 * * *}
    partition-months-ahead: ${STARRY_STATS_PARTITION_MONTHS_AHEAD:12}
    raw-retention-months: ${STARRY_STATS_RAW_RETENTION_MONTHS:4}
    raw-default-delete-batch-size: ${STARRY_STATS_RAW_DEFAULT_DELETE_BATCH_SIZE:10000}
    raw-default-delete-max-batches: ${STARRY_STATS_RAW_DEFAULT_DELETE_MAX_BATCHES:20}
    hourly-retention-days: ${STARRY_STATS_HOURLY_RETENTION_DAYS:90}
    hourly-delete-batch-size: ${STARRY_STATS_HOURLY_DELETE_BATCH_SIZE:10000}
    hourly-delete-max-batches: ${STARRY_STATS_HOURLY_DELETE_MAX_BATCHES:20}
    usage-event-retention-days: ${STARRY_STATS_USAGE_EVENT_RETENTION_DAYS:400}
    usage-event-delete-batch-size: ${STARRY_STATS_USAGE_EVENT_DELETE_BATCH_SIZE:10000}
    usage-event-delete-max-batches: ${STARRY_STATS_USAGE_EVENT_DELETE_MAX_BATCHES:100}
  payment:
    reconciliation-interval: ${STARRY_PAYMENT_RECONCILIATION_INTERVAL:PT30S}
    reconciliation-initial-delay: ${STARRY_PAYMENT_RECONCILIATION_INITIAL_DELAY:PT30S}
    provider-reconciliation-interval: ${STARRY_PAYMENT_PROVIDER_RECONCILIATION_INTERVAL:PT30S}
    provider-reconciliation-initial-delay: ${STARRY_PAYMENT_PROVIDER_RECONCILIATION_INITIAL_DELAY:PT45S}
  # Gateway settings. Every variable used to be named KIRO_*; those names are still read when the STARRY_*
  # one is not set, so existing .env files keep working.
  proxy:
    admin-token: ${STARRY_ADMIN_TOKEN:${KIRO_ADMIN_TOKEN:}}
    webui-url: ${STARRY_WEBUI_URL:${KIRO_WEBUI_URL:}}
    admin-session-ttl: ${STARRY_ADMIN_SESSION_TTL:${KIRO_ADMIN_SESSION_TTL:12h}}
    allow-anonymous-proxy: ${STARRY_ALLOW_ANONYMOUS_PROXY:${KIRO_ALLOW_ANONYMOUS_PROXY:false}}
    request-timeout: ${STARRY_REQUEST_TIMEOUT:${KIRO_REQUEST_TIMEOUT:300s}}
    max-retries: ${STARRY_MAX_RETRIES:${KIRO_MAX_RETRIES:2}}
    rate-limit-per-minute: ${STARRY_RATE_LIMIT_PER_MINUTE:${KIRO_RATE_LIMIT_PER_MINUTE:120}}
    account-selection-strategy: ${STARRY_ACCOUNT_SELECTION_STRATEGY:${KIRO_ACCOUNT_SELECTION_STRATEGY:round_robin}}
    session-affinity-enabled: ${STARRY_SESSION_AFFINITY_ENABLED:${KIRO_SESSION_AFFINITY_ENABLED:true}}
    session-affinity-ttl: ${STARRY_SESSION_AFFINITY_TTL:${KIRO_SESSION_AFFINITY_TTL:10m}}
    session-affinity-maximum-size: ${STARRY_SESSION_AFFINITY_MAXIMUM_SIZE:${KIRO_SESSION_AFFINITY_MAXIMUM_SIZE:100000}}
    base-cooldown: ${STARRY_BASE_COOLDOWN:${KIRO_BASE_COOLDOWN:60s}}
    quota-reset: ${STARRY_QUOTA_RESET:${KIRO_QUOTA_RESET:1h}}
    probabilistic-retry-chance: ${STARRY_PROBABILISTIC_RETRY:${KIRO_PROBABILISTIC_RETRY:0.1}}
    max-request-body-bytes: ${STARRY_MAX_REQUEST_BODY_BYTES:${KIRO_MAX_REQUEST_BODY_BYTES:10485760}}
    # The output limit of a Responses request that states none (Codex never does), no more than the model's own maximum. It is
    # what the reservation and the native sources are held to; a relay is given the maximum output its mapping states (up to this),
    # or 4096.
    responses-default-output-tokens: ${STARRY_RESPONSES_DEFAULT_OUTPUT_TOKENS:16000}
    token-refresh-interval-ms: ${STARRY_TOKEN_REFRESH_INTERVAL_MS:${KIRO_TOKEN_REFRESH_INTERVAL_MS:3600000}}
    token-refresh-initial-delay-ms: ${STARRY_TOKEN_REFRESH_INITIAL_DELAY_MS:${KIRO_TOKEN_REFRESH_INITIAL_DELAY_MS:60000}}
    # Amazon CodeWhisperer / Q endpoints used by Kiro accounts.
    kiro:
      preferred-endpoint: ${STARRY_KIRO_PREFERRED_ENDPOINT:${KIRO_PREFERRED_ENDPOINT:codewhisperer}}
      endpoints:
        - name: codewhisperer
          url: https://codewhisperer.us-east-1.amazonaws.com/generateAssistantResponse
          origin: AI_EDITOR
          target: AmazonCodeWhispererStreamingService.GenerateAssistantResponse
        - name: amazonq
          url: https://q.us-east-1.amazonaws.com/generateAssistantResponse
          origin: AI_EDITOR
          target: AmazonCodeWhispererStreamingService.GenerateAssistantResponse
        - name: amazonq-cli
          url: https://q.us-east-1.amazonaws.com/SendMessageStreaming
          origin: CLI
          target: AmazonQDeveloperStreamingService.SendMessage
