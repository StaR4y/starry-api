plugins {
    id 'org.springframework.boot'
}

def skipWebuiBuild = providers.gradleProperty('skipWebuiBuild')
    .map { it.toBoolean() }
    .orElse(false)
def webuiDistDir = project(':webui').layout.projectDirectory.dir('dist')
def webuiRuntimeResourcesDir = layout.buildDirectory.dir('generated/webui-resources')

dependencies {
    implementation project(':service-api')
    implementation project(':plugin-api')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.17'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.postgresql:r2dbc-postgresql'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.r2dbc:r2dbc-pool'
    implementation 'org.yaml:snakeyaml'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'io.netty:netty-resolver-dns-native-macos:4.1.132.Final:osx-aarch_64'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def prepareWebuiRuntimeResources = tasks.register('prepareWebuiRuntimeResources', Sync) {
    if (!skipWebuiBuild.get()) {
        dependsOn ':webui:npmBuild'
    }

    from(webuiDistDir) {
        into 'static'
    }
    into webuiRuntimeResourcesDir

    doFirst {
        if (!webuiDistDir.asFile.exists()) {
            throw new GradleException("WebUI dist is missing. Run :webui:npmBuild or remove -PskipWebuiBuild=true.")
        }
    }
}

tasks.named('bootRun') {
    dependsOn prepareWebuiRuntimeResources
    classpath webuiRuntimeResourcesDir
}

tasks.named('bootJar') {
    dependsOn prepareWebuiRuntimeResources
    from(webuiRuntimeResourcesDir) {
        into 'BOOT-INF/classes'
    }
}
