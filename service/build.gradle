plugins {
    id 'org.springframework.boot'
}

def skipWebuiBuild = providers.gradleProperty('skipWebuiBuild')
    .map { it.toBoolean() }
    .orElse(false)
def webuiDistDir = project(':webui').layout.projectDirectory.dir('dist')
def webuiRuntimeResourcesDir = layout.buildDirectory.dir('generated/webui-resources')

dependencies {
    implementation project(':service-api')
    implementation project(':plugin-api')

    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    // Boot 4 moved the WebClient.Builder auto-configuration (used by NewsService) out of the webflux starter.
    implementation 'org.springframework.boot:spring-boot-starter-webclient'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:3.1.1'
    implementation 'com.github.ben-manes.caffeine:caffeine'
    implementation 'org.postgresql:r2dbc-postgresql'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.r2dbc:r2dbc-pool'
    implementation 'org.yaml:snakeyaml'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    // Version comes from the Netty BOM that Spring Boot imports, so it always matches the other Netty artifacts.
    runtimeOnly group: 'io.netty', name: 'netty-resolver-dns-native-macos', classifier: 'osx-aarch_64'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def prepareWebuiRuntimeResources = tasks.register('prepareWebuiRuntimeResources', Sync) {
    if (!skipWebuiBuild.get()) {
        dependsOn ':webui:npmBuild'
    }

    from(webuiDistDir) {
        into 'static'
    }
    into webuiRuntimeResourcesDir

    doFirst {
        if (!webuiDistDir.asFile.exists()) {
            throw new GradleException("WebUI dist is missing. Run :webui:npmBuild or remove -PskipWebuiBuild=true.")
        }
    }
}

tasks.named('bootRun') {
    dependsOn prepareWebuiRuntimeResources
    classpath webuiRuntimeResourcesDir
}

// generateJavaNotices (JAVA-THIRD-PARTY-NOTICES.txt for the jar) and copyleftSources (the -sources jars of the libraries
// used under a copyleft license), see the script.
apply from: 'third-party-notices.gradle'

tasks.named('bootJar') {
    dependsOn prepareWebuiRuntimeResources
    from(webuiRuntimeResourcesDir) {
        into 'BOOT-INF/classes'
    }
    // AGPL-3.0-only: the license text and the notices (license elections, data credits, trademarks) travel with the
    // binary, at META-INF/ like the files in the Spring Boot jars it nests. The console's own third-party notices
    // (THIRD-PARTY-NOTICES.txt) arrive with the webui resources above.
    from(rootProject.layout.projectDirectory.file('LICENSE')) {
        into 'META-INF'
    }
    from(rootProject.layout.projectDirectory.file('NOTICE')) {
        into 'META-INF'
    }
}
